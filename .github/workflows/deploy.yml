name: CD - Despliegue automático en VM

on:
  workflow_run:
    workflows: ["CI - Build, Test y Push a Docker Hub"]
    types:
      - completed
    branches:
      - master

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Descargar última imagen y reiniciar servicio
        run: |
          docker rm -f amate_app || true
          docker compose pull app
          docker compose up -d app

      - name: Verificar estado del contenedor
        run: |
          sleep 3
          docker ps --filter "name=amate_app"
